name: Create Release & Build Artifacts

on:
  push:
    tags:
      - 'v*.*.*'
      - 'release-*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG=${{ github.ref }}
          VERSION=${TAG#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Generate release notes
        id: release_notes
        run: |
          {
            echo "RELEASE_NOTES<<EOF"
            echo "# DJI OSD Tool Release ${{ steps.version.outputs.version }}"
            echo ""
            echo "## Changes"
            if [ -f CHANGELOG.md ]; then
              grep -A20 "## \[${{ steps.version.outputs.version }}\]" CHANGELOG.md || echo "See CHANGELOG.md for details"
            else
              echo "For detailed changes, check the commit history"
            fi
            echo ""
            echo "## Installation"
            echo "1. Download the source code (zip or tar.gz)"
            echo "2. Extract the archive"
            echo "3. Install dependencies: \`pip install -r requirements.txt\`"
            echo "4. Run: \`python dji_osd_tool.py\`"
            echo ""
            echo "## Requirements"
            echo "- Python 3.8+"
            echo "- OpenCV, pandas, numpy"
            echo ""
            echo "Supported platforms: Windows, macOS, Linux"
            echo "EOF" 
          } >> $GITHUB_OUTPUT

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          release_name: "Release ${{ steps.version.outputs.version }}"
          body: ${{ steps.release_notes.outputs.RELEASE_NOTES }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') }}

  source-artifacts:
    name: Upload Source Artifacts
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create source archives
        run: |
          mkdir -p artifacts
          zip -r artifacts/dji-osd-tool-source.zip . -x "*.git*" "__pycache__/*" "*.pyc" ".tox/*" ".pytest_cache/*" "build/*" "dist/*"
          tar --exclude='.git' --exclude='__pycache__' --exclude='*.pyc' --exclude='.tox' --exclude='.pytest_cache' -czf artifacts/dji-osd-tool-source.tar.gz .

      - name: Upload artifacts as release attachments
        uses: actions/upload-artifact@v3
        with:
          name: source-artifacts
          path: artifacts/

      - name: Display generated artifacts
        run: ls -lh artifacts/
