name: Create Release & Build Artifacts

on:
  push:
    tags:
      - 'v*.*.*'
      - 'release-*'

jobs:
  build-linux:
    name: Build Linux Executable
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux executable
        run: |
          pyinstaller --onefile \
            --name dji-osd-tool \
            --windowed \
            --icon=./assets/icon.png 2>/dev/null || \
          pyinstaller --onefile \
            --name dji-osd-tool \
            --windowed \
            dji_osd_tool.py

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-executable
          path: dist/dji-osd-tool

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows executable
        run: |
          pyinstaller --onefile `
            --name dji-osd-tool `
            --windowed `
            --icon=./assets/icon.ico 2>$null; `
          if ($LASTEXITCODE -ne 0) { `
            pyinstaller --onefile `
              --name dji-osd-tool `
              --windowed `
              dji_osd_tool.py `
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: dist/dji-osd-tool.exe

  release:
    name: Create Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG=${{ github.ref }}
          VERSION=${TAG#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Download Linux executable
        uses: actions/download-artifact@v4
        with:
          name: linux-executable
          path: ./linux-build

      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: windows-executable
          path: ./windows-build

      - name: Generate release notes
        id: release_notes
        run: |
          {
            echo "RELEASE_NOTES<<EOF"
            echo "# DJI OSD Tool Release ${{ steps.version.outputs.version }}"
            echo ""
            echo "## Download"
            echo "- **Windows**: dji-osd-tool-windows.exe (Standalone executable, no Python required)"
            echo "- **Linux**: dji-osd-tool-linux (Standalone executable, no Python required)"
            echo "- **Source Code**: Download source.zip or source.tar.gz"
            echo ""
            echo "## Installation"
            echo ""
            echo "### Windows"
            echo "1. Download dji-osd-tool-windows.exe"
            echo "2. Run the .exe file directly"
            echo "3. No installation required!"
            echo ""
            echo "### Linux"
            echo "\`\`\`bash"
            echo "chmod +x dji-osd-tool-linux"
            echo "./dji-osd-tool-linux"
            echo "\`\`\`"
            echo ""
            echo "### macOS / From Source"
            echo "1. Download source code (zip or tar.gz)"
            echo "2. Extract the archive"
            echo "3. Install dependencies: \`pip install -r requirements.txt\`"
            echo "4. Run: \`python dji_osd_tool.py\`"
            echo ""
            echo "## Changes"
            if [ -f CHANGELOG.md ]; then
              grep -A20 "## \[${{ steps.version.outputs.version }}\]" CHANGELOG.md || echo "See CHANGELOG.md for details"
            else
              echo "Check the commit history for changes"
            fi
            echo ""
            echo "## Requirements"
            echo "- Windows executable: No requirements (Python bundled)"
            echo "- Linux executable: No requirements (Python bundled)"
            echo "- From source: Python 3.8+, opencv-python, pandas, numpy"
            echo ""
            echo "Supported platforms: Windows 7+, Linux, macOS 10.14+"
            echo "EOF" 
          } >> $GITHUB_OUTPUT

      - name: Create Release or Update if exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.release_notes.outputs.RELEASE_NOTES }}
        run: |
          # Check if release exists
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, updating..."
            gh release edit "$TAG" --notes "$NOTES"
          else
            echo "Creating new release $TAG..."
            IS_PRERELEASE=""
            if [[ "$TAG" == *"alpha"* ]] || [[ "$TAG" == *"beta"* ]]; then
              IS_PRERELEASE="--prerelease"
            fi
            gh release create "$TAG" --title "Release $TAG" --notes "$NOTES" $IS_PRERELEASE
          fi
        shell: bash

      - name: Upload executables to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.version }}
        run: |
          # Upload Windows executable
          if [ -f "./windows-build/dji-osd-tool.exe" ]; then
            echo "Uploading Windows executable..."
            gh release upload "$TAG" "./windows-build/dji-osd-tool.exe" --clobber || true
          fi
          
          # Upload Linux executable
          if [ -f "./linux-build/dji-osd-tool" ]; then
            echo "Uploading Linux executable..."
            gh release upload "$TAG" "./linux-build/dji-osd-tool" --clobber || true
          fi
        shell: bash

  source-artifacts:
    name: Upload Source Artifacts
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG=${{ github.ref }}
          VERSION=${TAG#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create source archives
        run: |
          mkdir -p artifacts
          zip -r artifacts/dji-osd-tool-source.zip . -x "*.git*" "__pycache__/*" "*.pyc" ".tox/*" ".pytest_cache/*" "build/*" "dist/*" "*.spec"
          tar --exclude='.git' --exclude='__pycache__' --exclude='*.pyc' --exclude='.tox' --exclude='.pytest_cache' --exclude='build' --exclude='dist' --exclude='*.spec' -czf artifacts/dji-osd-tool-source.tar.gz .

      - name: Upload source code to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.version }}
        run: |
          echo "Uploading source archives to release $TAG..."
          gh release upload "$TAG" \
            artifacts/dji-osd-tool-source.zip \
            artifacts/dji-osd-tool-source.tar.gz \
            --clobber || true
        shell: bash

      - name: Display generated artifacts
        run: ls -lh artifacts/
