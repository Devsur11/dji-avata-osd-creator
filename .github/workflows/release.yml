name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false

  build-artifacts:
    name: Build Artifacts
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: dji-osd-tool_linux_x64
            asset_name: dji-osd-tool-linux-x64.tar.gz
          - os: windows-latest
            artifact_name: dji-osd-tool_windows_x64.exe
            asset_name: dji-osd-tool-windows-x64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          pyinstaller --onefile \
            --add-data "LICENSE:." \
            --add-data "README.md:." \
            --name dji-osd-tool \
            dji_osd_tool.py

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --windowed `
            --add-data "LICENSE;." `
            --add-data "README.md;." `
            --name dji-osd-tool `
            dji_osd_tool.py

      - name: Create archive (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -czf dji-osd-tool-linux-x64.tar.gz -C dist dji-osd-tool
          ls -lh dji-osd-tool-linux-x64.tar.gz

      - name: Upload Release Asset (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./dji-osd-tool-linux-x64.tar.gz
          asset_name: dji-osd-tool-linux-x64.tar.gz
          asset_content_type: application/gzip

      - name: Upload Release Asset (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./dist/dji-osd-tool.exe
          asset_name: dji-osd-tool-windows-x64.exe
          asset_content_type: application/octet-stream
