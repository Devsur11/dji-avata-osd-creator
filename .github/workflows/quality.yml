name: Code Quality & Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint bandit
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 dji_osd_tool.py --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 dji_osd_tool.py --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Security check with bandit
        run: bandit -r dji_osd_tool.py -v || true

      - name: Import check
        run: python -c "import dji_osd_tool; print('Import successful!')"

  compatibility:
    name: Cross-Platform Compatibility
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify imports on ${{ matrix.os }}
        run: python -c "import sys; import cv2; import pandas; import numpy; print(f'All imports successful on {sys.platform}')"

      - name: Test CLI help
        run: python dji_osd_tool.py --help || python dji_osd_tool.py 2>&1 | grep -i "overlay\|check\|gui" || true
