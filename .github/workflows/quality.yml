name: Code Quality & Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint bandit
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 dji_osd_tool.py --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 dji_osd_tool.py --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Security check with bandit
        run: bandit -r dji_osd_tool.py -v || true

      - name: Import check
        run: python -c "import dji_osd_tool; print('Import successful!')"

  compatibility:
    name: Cross-Platform Compatibility
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify imports on ${{ matrix.os }}
        run: python -c "import sys; import cv2; import pandas; import numpy; print(f'All imports successful on {sys.platform}')"

      - name: Test module structure
        run: |
          python -c "
          import inspect
          import dji_osd_tool
          
          # Verify key classes and functions exist
          assert hasattr(dji_osd_tool, 'OSDSettings'), 'Missing OSDSettings class'
          assert hasattr(dji_osd_tool, 'DJIOSDOverlay'), 'Missing DJIOSDOverlay class'
          assert hasattr(dji_osd_tool, 'detect_flights'), 'Missing detect_flights function'
          assert hasattr(dji_osd_tool, 'get_video_info'), 'Missing get_video_info function'
          assert hasattr(dji_osd_tool, 'cli_main'), 'Missing cli_main function'
          
          # Verify CLI main is callable
          assert callable(dji_osd_tool.cli_main), 'cli_main is not callable'
          
          print('All module structure checks passed!')
          print('Available classes: OSDSettings, DJIOSDOverlay')
          print('Available functions: detect_flights, get_video_info, cli_main, get_app_data_dir')
          "
