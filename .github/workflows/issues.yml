name: Issue Management

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]

permissions:
  issues: write
  pull-requests: write

jobs:
  label-issue:
    name: Auto-label Issues
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body?.toLowerCase() || '';
            const title = issue.title?.toLowerCase() || '';
            const fullText = `${title} ${body}`;

            // Build label suggestions based on keywords
            let labels = [];

            // Bug labels
            if (fullText.includes('bug') || fullText.includes('crash') || 
                fullText.includes('error') || fullText.includes('not working')) {
              labels.push('bug');
            }

            // Feature request labels
            if (fullText.includes('feature') || fullText.includes('enhancement') ||
                fullText.includes('request') || fullText.includes('add')) {
              labels.push('enhancement');
            }

            // Documentation labels
            if (fullText.includes('doc') || fullText.includes('readme') ||
                fullText.includes('documentation')) {
              labels.push('documentation');
            }

            // UI/UX labels
            if (fullText.includes('gui') || fullText.includes('ui') ||
                fullText.includes('interface') || fullText.includes('button')) {
              labels.push('ui');
            }

            // Performance labels
            if (fullText.includes('slow') || fullText.includes('performance') ||
                fullText.includes('lag') || fullText.includes('speed')) {
              labels.push('performance');
            }

            // Platform-specific labels
            if (fullText.includes('windows')) {
              labels.push('windows');
            }
            if (fullText.includes('linux')) {
              labels.push('linux');
            }
            if (fullText.includes('mac')) {
              labels.push('macos');
            }

            // Help wanted
            if (fullText.includes('help') || fullText.includes('stuck')) {
              labels.push('help wanted');
            }

            // Remove duplicates
            labels = [...new Set(labels)];

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: labels
              });
            }

  stale-comment:
    name: Check for Missing Details
    runs-on: ubuntu-latest
    if: github.event.action == 'opened'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';

            // Check if issue has minimal information
            const hasEnvironment = body.includes('OS') || body.includes('Version') || 
                                  body.includes('Python');
            const hasSteps = body.includes('step') || body.includes('reproduce');
            const hasError = body.includes('error') || body.includes('traceback');

            if (!hasEnvironment || !hasSteps) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Thanks for reporting this issue! 🙏\n\nTo help us investigate faster, please provide:\n\n- **Operating System** (Windows, Linux, macOS)\n- **Python Version** (e.g., 3.10, 3.11)\n- **Steps to Reproduce** - what did you do?\n- **Error Message/Traceback** - if applicable\n\nThis helps us track down the problem more quickly!`
              });
            }
